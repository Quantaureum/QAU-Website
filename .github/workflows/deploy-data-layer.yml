name: Deploy Data Layer

on:
  push:
    branches:
      - master
    paths:
      - "src/data-layer/**"
      - "trigger.config.ts"
      - "package.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install deps
        run: pnpm install

      - name: Deploy to Trigger.dev
        if: ${{ secrets.TRIGGER_ACCESS_TOKEN != '' }}
        run: pnpm exec trigger deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          TRIGGER_PROJECT_REF: ${{ secrets.TRIGGER_PROJECT_REF }}

      - name: Warn (Trigger.dev credentials missing)
        if: ${{ secrets.TRIGGER_ACCESS_TOKEN == '' }}
        run: |
          echo "::warning title=Trigger.dev not configured::TRIGGER_ACCESS_TOKEN secret is empty, so the Trigger.dev data-layer deploy was skipped. Add the secret to enable deploys."

name: Suggest quiz
description: Add, update, delete questions for a quiz on quantaureum.com
title: Add/Update/Delete quiz question
labels: ["feature ✨", "quiz 📚"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [contribution guide](https://github.com/Quantaureum/QAU-Website/blob/master/CONTRIBUTING.md) before submitting. Quiz questions must be factually accurate and neutral; a suggestion does not guarantee publication.
  - type: input
    id: page
    attributes:
      label: Page URL
      description: URL for the page the quiz can be found on, or should be added to
    validations:
      required: true
  - type: textarea
    id: question_content
    attributes:
      label: Question content
      description: Suggest questions to add, update, or delete based on contribution guideline
    validations:
      required: true
  - type: checkboxes
    id: work_on
    attributes:
      label: Would you like to work on this issue?
      options:
        - label: "Yes"
          required: false
        - label: "No"
          required: false
    validations:
      required: true
